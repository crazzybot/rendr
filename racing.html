<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rendr — Racing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    #speed {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }

    #speed-unit {
      font-size: 14px;
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #controls {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.55);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.8;
    }

    #controls strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    kbd {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 12px;
      font-family: monospace;
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(200, 30, 30, 0.9);
      padding: 20px 28px;
      border-radius: 8px;
      display: none;
      max-width: 480px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="speed">0</div>
    <div id="speed-unit">km/h</div>
  </div>

  <div id="controls">
    <strong>Racing Controls</strong>
    <kbd>W</kbd> Accelerate &nbsp; <kbd>S</kbd> Reverse<br>
    <kbd>A</kbd> / <kbd>D</kbd> or <kbd>◀</kbd> / <kbd>▶</kbd> Steer<br>
    <kbd>Space</kbd> Brake
  </div>

  <div id="error"></div>

  <script type="module" src="/example/racing/main.ts"></script>
</body>
</html>
