<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU Game Framework - Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 5px;
      font-size: 14px;
      line-height: 1.6;
    }

    #info h2 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.8);
      padding: 20px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <h2>WebGPU Game Framework Demo</h2>
    <p><strong>Controls:</strong></p>
    <p>WASD - Move camera</p>
    <p>Mouse - Look around (click to lock)</p>
    <p>Space/Shift - Up/Down</p>
    <p>ESC - Exit pointer lock</p>
  </div>

  <div id="error"></div>

  <script type="module" src="/example/demo.ts"></script>
</body>
</html>
